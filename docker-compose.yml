version: "3.9"

services:
  # ─── PostgreSQL 16 ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kuruta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kuruta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kuruta_dev}
      POSTGRES_DB: ${POSTGRES_DB:-kuruta}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kuruta} -d ${POSTGRES_DB:-kuruta}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis 7 ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kuruta-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-kuruta_dev}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-kuruta_dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── MinIO (S3-compatible) ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: kuruta-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-kuruta_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-kuruta_minio_secret}
    command: server /data --console-address ":9001"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO bucket init (one-shot) ──────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: kuruta-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set kuruta http://minio:9000 ${S3_ACCESS_KEY:-kuruta_minio} ${S3_SECRET_KEY:-kuruta_minio_secret};
        mc mb --ignore-existing kuruta/${S3_BUCKET:-kuruta-uploads};
        mc anonymous set download kuruta/${S3_BUCKET:-kuruta-uploads}/public;
        echo 'MinIO buckets initialized.';
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
